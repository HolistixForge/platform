---
# Default inventory: the local development VM managed by infra/vm/vmctl.sh.
#
# `vmctl.sh up` writes infra/ansible/.ssh-config (gitignored) from the VM
# backend, so this inventory stays static regardless of the port the
# hypervisor picked.
#
# For a production server, use inventory/production.yml instead:
#   ansible-playbook -i inventory/production.yml site.yml

all:
  children:
    dev_vm:
      hosts:
        holistix-vm:
          ansible_host: lima-holistix
          ansible_ssh_common_args: '-F {{ playbook_dir }}/.ssh-config'
