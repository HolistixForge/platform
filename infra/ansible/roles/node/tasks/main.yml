---
# Node.js from NodeSource. The `nodistro` suite carries both amd64 and arm64,
# so the same repo line works on an Apple Silicon VM and on an x86 VPS.

- name: Check the installed Node.js version
  ansible.builtin.command: node --version
  register: node_installed
  changed_when: false
  failed_when: false

- name: Remove the legacy one-line NodeSource source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent

- name: Install NodeSource repository and Node.js
  when: not node_installed.stdout.startswith('v' ~ node_major ~ '.')
  block:
    - name: Fetch the NodeSource signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: '0644'
        force: true

    - name: Add the NodeSource apt repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: [deb]
        uris: 'https://deb.nodesource.com/node_{{ node_major }}.x'
        suites: [nodistro]
        components: [main]
        architectures: ['{{ holistix_deb_arch }}']
        signed_by: /etc/apt/keyrings/nodesource.asc
        enabled: true
        state: present

    - name: Pin NodeSource so the distro package never wins
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nodesource
        mode: '0644'
        content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 1001

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

- name: Report the Node.js and npm versions
  ansible.builtin.shell: |
    set -o pipefail
    echo "node $(node --version) / npm $(npm --version)"
  args:
    executable: /bin/bash
  register: node_versions
  changed_when: false

- name: Show the toolchain versions
  ansible.builtin.debug:
    msg: '{{ node_versions.stdout }}'
