name: CI - Lint, Typecheck, Build, and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Explicitly define permissions for security
permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-24.04

    # Job-level permissions (most restrictive)
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for Nx affected commands

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx nx run-many -t lint --parallel=5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build all packages
        run: npx nx run-many -t build --parallel=5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Run TypeScript type checking
        run: npx nx run-many -t typecheck --parallel=5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Validate Vite configurations
        run: npm run validate:vite

      - name: Validate Node.js bundles
        run: npm run validate:node

      - name: Validate frontend build
        run: npm run test:build

      - name: Run all tests
        run: npx nx run-many -t test --parallel=3
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            **/eslint-report.json
          retention-days: 7

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/dist
            **/.nx
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/coverage
            **/test-results
          retention-days: 7
