name: CI - Lint, Typecheck, Build, and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Explicitly define permissions for security
permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-24.04

    # Job-level permissions (most restrictive)
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for Nx affected commands

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx nx run-many -t lint --parallel=5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build all packages
        run: npx nx run-many -t build --parallel=5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Run TypeScript type checking
        run: npx nx run-many -t typecheck --parallel=5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Validate Vite configurations
        run: npm run validate:vite

      - name: Validate Node.js bundles
        run: npm run validate:node

      - name: Validate frontend build
        run: npm run test:build

      - name: Run Stylelint (graphic charter)
        run: npm run stylelint

      - name: Run all tests
        run: npx nx run-many -t test --parallel=3
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            **/eslint-report.json
          retention-days: 7

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/dist
            **/.nx
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/coverage
            **/test-results
          retention-days: 7

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-24.04
    needs: validate

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build all Storybooks
        run: npx nx run-many -t build-storybook --parallel=3
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Run visual regression tests
        run: |
          for dir in packages/*/storybook-static packages/modules/*/storybook-static; do
            if [ -d "$dir" ]; then
              pkg=$(echo "$dir" | sed 's|/storybook-static||')
              echo "Testing $pkg..."
              npx http-server "$dir" -p 6006 --silent &
              SERVER_PID=$!
              sleep 3
              npx test-storybook --url http://127.0.0.1:6006 --config-dir "$pkg/.storybook" || true
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
            fi
          done

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            **/__diff_output__
          retention-days: 7
